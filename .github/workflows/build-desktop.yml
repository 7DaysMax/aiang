name: Build Windows Desktop

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source and engine binaries
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: true
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Check types and credential-format tests
        run: |
          bunx tsc --noEmit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun test ./src/shared/api-key.test.ts

      - name: Build installer and portable executable
        run: bun run pack:exe

      - name: Smoke-test packaged backend without model credentials
        run: |
          $packageRoot = (Resolve-Path 'release/electron/win-unpacked/resources').Path
          $env:AIANG_ROOT = $packageRoot
          $stdoutPath = Join-Path $env:RUNNER_TEMP 'youmi-backend.stdout.log'
          $stderrPath = Join-Path $env:RUNNER_TEMP 'youmi-backend.stderr.log'
          $backend = Start-Process -FilePath (Join-Path $packageRoot 'aiang-server.exe') `
            -ArgumentList '--no-open', '--host', '127.0.0.1', '--port', '3210' `
            -WorkingDirectory $packageRoot -PassThru `
            -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 60; $attempt++) {
              if ($backend.HasExited) { throw "Packaged backend exited with code $($backend.ExitCode)" }
              try {
                $response = Invoke-WebRequest 'http://127.0.0.1:3210/' -TimeoutSec 2
                if ($response.StatusCode -eq 200 -and $response.Content -match '<html') {
                  $ready = $true
                  break
                }
              } catch [System.Net.Http.HttpRequestException] {
                # The backend may still be starting.
              } catch [System.Threading.Tasks.TaskCanceledException] {
                # Retry bounded startup timeouts.
              }
              Start-Sleep -Milliseconds 500
            }
            if (-not $ready) { throw 'Packaged backend did not serve the app within the startup deadline' }
            Write-Output 'Packaged backend served the application successfully without model credentials.'
          } finally {
            if (-not $backend.HasExited) { Stop-Process -Id $backend.Id -Force }
            if (Test-Path $stdoutPath) { Get-Content $stdoutPath }
            if (Test-Path $stderrPath) { Get-Content $stderrPath }
          }

      - name: Write checksums
        run: |
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $files = @(
            "release/electron/Youmi-Aiagent-$packageVersion-setup.exe",
            "release/electron/Youmi-Aiagent-$packageVersion-portable.exe"
          )
          $checksums = foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Missing package: $file" }
            $hash = (Get-FileHash -Path $file -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path $file -Leaf)"
          }
          $checksums | Set-Content 'release/electron/SHA256SUMS.txt' -Encoding utf8
          "version=$packageVersion" >> $env:GITHUB_OUTPUT
        id: package

      - name: Upload verified Windows packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Youmi-Windows-x64-${{ steps.package.outputs.version }}
          path: |
            release/electron/Youmi-Aiagent-*-setup.exe
            release/electron/Youmi-Aiagent-*-portable.exe
            release/electron/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
